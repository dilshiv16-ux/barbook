<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bar Book">
<meta name="theme-color" content="#14110f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Bar Book</title>
<style>
  :root{
    --bg:#14110f; --panel:#1f1a17; --panel2:#2a2420; --line:#3a322c;
    --text:#f3ece4; --muted:#a89a8c; --accent:#d9a55b; --accent2:#f0c27a;
    --warn:#e8743b; --ok:#6fbf73;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button,input{font:inherit;color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:22px;margin:0;letter-spacing:.5px;color:var(--accent2);font-weight:700}
  .status{font-size:12px;color:var(--muted);text-align:right}
  .search{margin-top:10px;position:relative}
  .search input{width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);outline:none;font-size:16px}
  .search input:focus{border-color:var(--accent)}
  .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
    color:var(--muted);font-size:22px;padding:4px 10px;display:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;
    padding:8px 14px;font-size:14px;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#1a1209;font-weight:700}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin:22px 2px 10px}
  h2 .count{color:var(--muted);font-weight:400}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin:0 0 12px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-weight:700;font-size:18px;color:var(--accent2)}
  .barlabel{font-size:12px;color:var(--muted);margin-top:2px}
  .tag{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.8px;padding:3px 7px;border-radius:6px}
  .tag.unv{background:rgba(232,116,59,.15);color:var(--warn);border:1px solid rgba(232,116,59,.5)}
  .tag.ver{background:rgba(111,191,115,.12);color:var(--ok);border:1px solid rgba(111,191,115,.45)}
  .serve{margin:6px 0 8px;color:var(--text);font-size:15px}
  .serve b{color:var(--muted);font-weight:600}
  ul.ing{list-style:none;margin:0;padding:0}
  ul.ing li{padding:3px 0;font-size:16.5px;border-bottom:1px dashed #2f2823}
  ul.ing li:last-child{border-bottom:0}
  .preplink{color:var(--accent2);text-decoration:underline;text-decoration-style:dotted;
    text-underline-offset:3px;cursor:pointer}
  .method{margin-top:8px;font-size:15px;color:var(--text);font-style:italic}
  details{margin-top:8px;font-size:13.5px;color:var(--muted)}
  summary{cursor:pointer;color:var(--muted)}
  details p{margin:6px 0 0}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .banner{background:rgba(232,116,59,.1);border:1px solid rgba(232,116,59,.35);color:#f2b48f;
    border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:14px}
  /* lock */
  #lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
  .lockbox{width:100%;max-width:320px;text-align:center}
  .lockbox h1{font-size:30px;margin-bottom:6px}
  .lockbox p{color:var(--muted);margin:0 0 18px}
  .dots{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
  .dot.f{background:var(--accent)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pad button{padding:16px 0;font-size:22px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
  .pad button:active{background:var(--panel2)}
  .shake{animation:sh .35s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
  #modal.show{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:720px;max-height:85vh;overflow:auto;
    border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .sheet .close{float:right;border:0;background:var(--panel2);border-radius:999px;width:34px;height:34px;font-size:18px}
</style>
</head>
<body>

<div id="lock" style="display:none">
  <div class="lockbox">
    <h1>Bar Book</h1>
    <p>Enter staff code</p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
  </div>
</div>

<header>
  <div class="wrap" style="padding-bottom:0">
    <div class="top"><h1>Bar Book</h1><div class="status" id="status"></div></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search drinks, spirits, glass…" autocomplete="off">
      <button class="clear" id="clr" aria-label="Clear">×</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>

arnish": "Queen olive, rosemary sprig", "Ingredients": "2.5oz olive-oil-washed Belvedere\n1/2oz dry vermouth\n2 drops olive oil on top", "Method": "Stir, strain into chilled Nick & Nora, float olive oil", "Notes": "Vermouth isn't on the menu — could be straight washed vodka. Verify.", "Menu Description": "Belvedere Vodka, Olive Oil, Queen Olive, Rosemarry", "Verified": "NO"}, {"Bar": "HB's", "Menu": "Current", "Drink": "Orzata Collins (Spirit Free)", "Glass": "Collins", "Ice": "Collins ice", "Garnish": "Lemon wheel", "Ingredients": "1oz orgeat\n1oz lemon\n2 dash orange blossom water\nTop: 3oz soda", "Method": "Shake (no soda), strain over fresh ice, top soda", "Notes": "", "Menu Description": "Almond, Lemon, Orange Blossom, Soda", "Verified": "NO"}, {"Bar": "HB's", "Menu": "Current", "Drink": "HoneyBee (Spirit Free)", "Glass": "Rocks", "Ice": "Cubes", "Garnish": "Lemon wheel, dried chamomile", "Ingredients": "1oz yuzu juice\n1oz chamomile honey syrup\n2 drops saline\nTop: 1oz soda", "Method": "Shake (no soda), strain over fresh ice, top soda", "Notes": "", "Menu Description": "Yuzu, Chamomile Honey, Sea Salt", "Verified": "NO"}, {"Bar": "Sunset Bar", "Menu": "Current", "Drink": "Sabrina Sunset", "Glass": "Highball", "Ice": "Collins ice", "Garnish": "Fresh raspberries", "Ingredients": "1.5oz Ketel One Vodka\n3/4oz fermented raspberry syrup\n3/4oz lemon\nTop: 2oz soda", "Method": "Shake (no soda), strain over fresh ice, top soda", "Notes": "", "Menu Description": "Ketel One Vodka, Fermented Raspberry, Citrus, Club Soda", "Verified": "NO"}, {"Bar": "Sunset Bar", "Menu": "Current", "Drink": "Cooper and Sons", "Glass": "Rocks", "Ice": "Big cube", "Garnish": "Dusting of cinnamon", "Ingredients": "1.5oz Del Maguey Chichicapa Mezcal\n3/4oz tamarind syrup\n3/4oz lemon\n1/4oz cinnamon syrup\n2 dash habanero tincture\nClarified with whole milk (see Prep: Milk clarification)", "Method": "Batched + milk-clarified. To serve: pour 3.5oz batch over big cube, stir 5 sec", "Notes": "   get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

/* ---------- lock ---------- */
function startLock(onOk){
  if (!CONFIG.STAFF_CODE || store.get("bb_code") === CONFIG.STAFF_CODE) return onOk();
  const lock = document.getElementById("lock"), dots = document.getElementById("dots"), pad = document.getElementById("pad");
  lock.style.display = "flex";
  let entry = "";
  const n = CONFIG.STAFF_CODE.length;
  const draw = () => { dots.innerHTML = Array.from({length:n},(_,i)=>`<div class="dot ${i<entry.length?'f':''}"></div>`).join("") };
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k=>{
    const b = document.createElement("button");
    b.textContent = k; if (!k) b.style.visibility = "hidden";
    b.onclick = () => {
      if (k === "⌫") entry = entry.slice(0,-1);
      else if (entry.length < n) entry += k;
      draw();
      if (entry.length === n){
        if (entry === CONFIG.STAFF_CODE){ store.set("bb_code", entry); lock.style.display="none"; onOk(); }
        else { dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake"); entry=""; setTimeout(draw,350); }
      }
    };
    pad.appendChild(b);
  });
  draw();
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){
      if (c==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    } else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!=='\r') f+=c;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift()||[]).map(h=>h.trim());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
async function fetchTab(name){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP "+r.status);
  return parseCSV(await r.text());
}

let DATA = STARTER, bar = null, query = "";
const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isVerified = v => /^(yes|y|true|x|✓|✔|verified)$/i.test(String(v||"").trim());

function bars(){
  const seen=[]; DATA.drinks.forEach(d=>{ if (d.Bar && !seen.includes(d.Bar)) seen.push(d.Bar) }); return seen;
}
function prepIndex(){
  return DATA.preps.filter(p=>p.Prep).map(p=>({name:p.Prep, key:p.Prep.toLowerCase(), p}))
    .sort((a,b)=>b.key.length-a.key.length);
}

/* ---------- render ---------- */
function renderChips(){
  const list = [...bars(), "Preps"];
  if (!bar || !list.includes(bar)) bar = list[0];
  $("chips").innerHTML = list.map(b=>`<button class="chip ${b===bar && !query?'on':''}" data-b="${esc(b)}">${esc(b)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{
    bar = el.dataset.b; query=""; $("q").value=""; $("clr").style.display="none"; render(); window.scrollTo(0,0);
  });
}
function linkPreps(line, idx){
  const low = line.toLowerCase();
  for (const it of idx){
    const at = low.indexOf(it.key);
    if (at >= 0){
      return esc(line.slice(0,at)) + `<span class="preplink" data-prep="${esc(it.name)}">${esc(line.slice(at,at+it.key.length))}</span>` + esc(line.slice(at+it.key.length));
    }
  }
  return esc(line);
}
function drinkCard(d, showBar, idx){
  const ver = isVerified(d.Verified);
  const serve = [d.Glass, d.Ice, d.Garnish].filter(Boolean).map(esc).join(", ");
  const ings = String(d.Ingredients||"").split(/\n|;\s*/).map(s=>s.trim()).filter(Boolean);
  const more = [d.Notes && `<p><b>Notes:</b> ${esc(d.Notes)}</p>`, d["Menu Description"] && `<p><b>Menu says:</b> ${esc(d["Menu Description"])}</p>`].filter(Boolean).join("");
  return `<div class="card">
    <div class="head">
      <div><div class="name">“${esc(d.Drink)}”</div>${showBar?`<div class="barlabel">${esc(d.Bar)} · ${esc(d.Menu||"Current")}</div>`:""}</div>
      <span class="tag ${ver?'ver':'unv'}">${ver?'VERIFIED':'UNVERIFIED'}</span>
    </div>
    ${serve?`<div class="serve"><b>&gt;</b> ${serve}</div>`:""}
    <ul class="ing">${ings.map(i=>`<li>${linkPreps(i, idx)}</li>`).join("")}</ul>
    ${d.Method?`<div class="method">${esc(d.Method)}</div>`:""}
    ${more?`<details><summary>Notes &amp; menu description</summary>${more}</details>`:""}
  </div>`;
}
function prepCard(p){
  const ver = isVerified(p.Verified);
  const ings = String(p.Ingredients||"").split(/\n|;\s*/).map(s=>s.trim()).filter(Boolean);
  const meta = [p.Yield && `Yield: ${esc(p.Yield)}`, p["Shelf Life"] && `Keeps: ${esc(p["Shelf Life"])}`].filter(Boolean).join(" · ");
  return `<div class="card">
    <div class="head"><div><div class="name">${esc(p.Prep)}</div>${meta?`<div class="barlabel">${meta}</div>`:""}</div>
      <span class="tag ${ver?'ver':'unv'}">${ver?'VERIFIED':'UNVERIFIED'}</span></div>
    <ul class="ing" style="margin-top:8px">${ings.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
    ${p.Method?`<div class="method">${esc(p.Method)}</div>`:""}
    ${p.Notes?`<details><summary>Notes</summary><p>${esc(p.Notes)}</p></details>`:""}
  </div>`;
}
function render(){
  renderChips();
  const idx = prepIndex();
  const main = $("main");
  let html = "";
  if (query){
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = o => { const hay = Object.values(o).join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)) };
    const ds = DATA.drinks.filter(hit), ps = DATA.preps.filter(hit);
    if (ds.length) html += `<h2>Drinks <span class="count">${ds.length}</span></h2>` + ds.map(d=>drinkCard(d,true,idx)).join("");
    if (ps.length) html += `<h2>Preps <span class="count">${ps.length}</span></h2>` + ps.map(prepCard).join("");
    if (!html) html = `<div class="empty">Nothing matches “${esc(query)}”.</div>`;
  } else if (bar === "Preps"){
    const ps = [...DATA.preps].sort((a,b)=>a.Prep.localeCompare(b.Prep));
    html = `<h2>Preps <span class="count">${ps.length}</span></h2>` + ps.map(prepCard).join("");
  } else {
    const ds = DATA.drinks.filter(d=>d.Bar===bar);
    const groups = []; ds.forEach(d=>{ const m = d.Menu || "Current"; if (!groups.includes(m)) groups.push(m) });
    groups.sort((a,b)=>(b.toLowerCase()==="current")-(a.toLowerCase()==="current"));
    groups.forEach(m=>{
      const list = ds.filter(d=>(d.Menu||"Current")===m);
      const title = m.toLowerCase()==="current" ? "Current Menu" : `Past Menu — ${m}`;
      html += `<h2>${esc(title)} <span class="count">${list.length}</span></h2>` + list.map(d=>drinkCard(d,false,idx)).join("");
    });
    if (!ds.length) html = `<div class="empty">No drinks for this bar yet.</div>`;
  }
  if (!CONFIG.SHEET_ID) html += `<div class="banner">Showing built-in starter recipes. Every spec is a guess until it's marked VERIFIED.</div>`;
  main.innerHTML = html;
  main.querySelectorAll(".preplink").forEach(el=>el.onclick=()=>openPrep(el.dataset.prep));
}
function openPrep(name){
  const p = DATA.preps.find(x=>x.Prep===name); if (!p) return;
  $("sheet").innerHTML = `<button class="close" aria-label="Close">×</button><h2 style="margin-top:4px">Prep</h2>` + prepCard(p);
  $("sheet").querySelector(".close").onclick = closeModal;
  $("modal").classList.add("show");
}
function closeModal(){ $("modal").classList.remove("show") }
$("modal").onclick = e => { if (e.target.id==="modal") closeModal() };

$("q").addEventListener("input", e=>{ query = e.target.value.trim(); $("clr").style.display = query?"block":"none"; render(); });
$("clr").onclick = ()=>{ query=""; $("q").value=""; $("clr").style.display="none"; render(); $("q").blur(); };

/* ---------- load ---------- */
async function load(){
  if (!CONFIG.SHEET_ID){ $("status").textContent = "Starter recipes"; render(); return; }
  const cached = store.get("bb_cache");
  if (cached){ try{ DATA = JSON.parse(cached); }catch(e){} }
  render();
  $("status").textContent = "Updating…";
  try{
    const [drinks, preps] = await Promise.all([fetchTab("Drinks"), fetchTab("Preps")]);
    if (!drinks.length) throw new Error("empty");
    DATA = {drinks, preps};
    store.set("bb_cache", JSON.stringify(DATA));
    $("status").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    render();
  }catch(e){
    $("status").textContent = cached ? "Offline — saved copy" : "Couldn't reach sheet";
  }
}
startLock(load);
</script>
</body>
</html>
